<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional | SIGIR - BCRP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <style>
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #111827 0%, #070B14 100%);
            margin: 0;
            padding: 24px;
            font-family: var(--font-sans);
            color: #F8FAFC;
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .login-emblem {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #F8FAFC;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: #94A3B8;
            margin: 0 0 28px 0;
            line-height: 1.4;
        }
        .role-selector-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748B;
            font-weight: 700;
            text-align: left;
            margin-bottom: 12px;
            display: block;
        }
        .role-option-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #F8FAFC;
        }
        .role-option-btn:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(226, 179, 87, 0.4);
            transform: translateY(-2px);
        }
        .role-option-btn:active {
            transform: scale(0.98);
        }
        .role-avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .role-info-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: #F8FAFC;
        }
        .role-info-desc {
            font-size: 0.75rem;
            color: #94A3B8;
            margin-top: 2px;
        }
        .btn-enter-guest {
            margin-top: 20px;
            background: transparent;
            border: none;
            color: #64748B;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 150ms;
        }
        .btn-enter-guest:hover {
            color: #94A3B8;
        }
        .login-footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.72rem;
            color: #475569;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-emblem">
            <svg class="icon-svg bcrp-emblem" width="48" height="48" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="18" cy="18" r="16.5" stroke="#E2B357" stroke-width="1.5" fill="#0B132B"/>
                <circle cx="18" cy="18" r="14" stroke="#E2B357" stroke-dasharray="1 2" stroke-width="0.8" opacity="0.6"/>
                <path d="M10 14.5L18 9L26 14.5H10Z" fill="#E2B357"/>
                <rect x="11" y="15" width="14" height="1.5" rx="0.5" fill="#E2B357"/>
                <rect x="12" y="17.5" width="2" height="6.5" rx="0.5" fill="#E2B357"/>
                <rect x="15.3" y="17.5" width="2" height="6.5" rx="0.5" fill="#E2B357"/>
                <rect x="18.7" y="17.5" width="2" height="6.5" rx="0.5" fill="#E2B357"/>
                <rect x="22" y="17.5" width="2" height="6.5" rx="0.5" fill="#E2B357"/>
                <rect x="10.5" y="24.5" width="15" height="1.5" rx="0.5" fill="#E2B357"/>
                <rect x="9" y="26.5" width="18" height="1.5" rx="0.5" fill="#E2B357"/>
            </svg>
        </div>

        <h1 class="login-title">SIGIR - BCRP</h1>
        <p class="login-subtitle">Sistema de Supervisión y Gestión de Incidentes Regulatorios<br>Switch Interbancario CCE &bull; Banco Central de Reserva del Perú</p>

        <span class="role-selector-label">Selecciona tu perfil de acceso:</span>

        <button type="button" class="role-option-btn" onclick="iniciarSesionComo('ARQUITECTO')">
            <div class="role-avatar-circle" style="background: rgba(226,179,87,0.15); color: #E2B357; border: 1px solid #E2B357;">FV</div>
            <div style="flex:1;">
                <div class="role-info-name">Frank Vargas Huamán</div>
                <div class="role-info-desc">Líder Técnico &bull; Arquitecto de Software &amp; NOC Lead (Acceso Total)</div>
            </div>
            <span style="color:#E2B357; font-size:1.1rem;">&rarr;</span>
        </button>

        <button type="button" class="role-option-btn" onclick="iniciarSesionComo('OPERADOR')">
            <div class="role-avatar-circle" style="background: rgba(56,189,248,0.15); color: #38BDF8; border: 1px solid #38BDF8;">OP</div>
            <div style="flex:1;">
                <div class="role-info-name">Fernando Romero / Joel Olaya</div>
                <div class="role-info-desc">Mesa de Ayuda &bull; Operador NOC (Gestión de Tickets)</div>
            </div>
            <span style="color:#38BDF8; font-size:1.1rem;">&rarr;</span>
        </button>

        <button type="button" class="role-option-btn" onclick="iniciarSesionComo('AUDITOR')">
            <div class="role-avatar-circle" style="background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid #10B981;">PZ</div>
            <div style="flex:1;">
                <div class="role-info-name">Prof. Zamata</div>
                <div class="role-info-desc">Auditor Regulatorio BCRP &bull; Jurado Evaluador UTP (Solo Lectura)</div>
            </div>
            <span style="color:#10B981; font-size:1.1rem;">&rarr;</span>
        </button>

        <br>
        <button type="button" class="btn-enter-guest" onclick="location.href='index.html'">
            Entrar directamente a la consola principal &rarr;
        </button>

        <div class="login-footer">
            Entorno Académico UTP 2026 &bull; Circular BCRP N° 0014-2023 &bull; Seguridad Criptográfica SHA-256
        </div>
    </div>

    <script src="js/auth-rbac.js"></script>
    <script>
        function iniciarSesionComo(rolId) {
            AuthRBAC.establecerRol(rolId);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }
    </script>
</body>
</html>
